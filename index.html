<style>
/* Layout: coluna única de celular (máx. 480px), cabeçalho verde em faixa, cartões brancos, barra inferior fixa com botão central de lançar */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#F0EDE5; --line:#E4E0D6; --fg:#1B1D1A; --muted:#5F625B;
  --brand:#1E5A47; --brand-deep:#143D30; --brand-ink:#FFFFFF; --brand-soft:#EAF2EE; --brand-text:#1E5A47; --hdr-sub:#CFE3DA;
  --ok:#3A9A66; --ok-text:#23704A; --ok-soft:#E1F0E7;
  --warn:#E39A14; --warn-text:#94560A; --warn-soft:#FBEFD6;
  --bad:#D2453A; --bad-text:#B3312A; --bad-soft:#FBE3DF;
  --info-soft:#E3E8F3; --info-text:#33497A;
  --track:#ECE8DF; --tick:#1B1D1A; --scrim:rgba(20,22,20,.45);
  --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1E1B; --surface-2:#222723; --line:#2E3430; --fg:#ECEDE8; --muted:#A5AAA1;
  --brand:#1E5A47; --brand-deep:#143D30; --brand-ink:#FFFFFF; --brand-soft:#1E3029; --brand-text:#86CDAE; --hdr-sub:#B9D7C9;
  --ok:#4CB37A; --ok-text:#86D9A9; --ok-soft:#1D3327;
  --warn:#E8A93A; --warn-text:#F2C56F; --warn-soft:#3A2F17;
  --bad:#E0645A; --bad-text:#F5978F; --bad-soft:#3E2321;
  --info-soft:#24304A; --info-text:#AFC2EA;
  --track:#2C322E; --tick:#ECEDE8; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --surface-2:#222723; --line:#2E3430; --fg:#ECEDE8; --muted:#A5AAA1;
  --brand:#1E5A47; --brand-deep:#143D30; --brand-ink:#FFFFFF; --brand-soft:#1E3029; --brand-text:#86CDAE; --hdr-sub:#B9D7C9;
  --ok:#4CB37A; --ok-text:#86D9A9; --ok-soft:#1D3327;
  --warn:#E8A93A; --warn-text:#F2C56F; --warn-soft:#3A2F17;
  --bad:#E0645A; --bad-text:#F5978F; --bad-soft:#3E2321;
  --info-soft:#24304A; --info-text:#AFC2EA;
  --track:#2C322E; --tick:#ECEDE8; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.4; font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warn); outline-offset:2px}
h1,h2,h3{margin:0; text-wrap:balance}
.app{max-width:480px; margin:0 auto; min-height:100%; padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{background:var(--brand); color:var(--brand-ink); padding-block:18px 20px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:12px}
.hdr.tall{padding-bottom:76px}
.hdr-row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.hdr h1{font-size:23px; font-weight:800}
.hdr .sub{font-size:13px; color:var(--hdr-sub)}
.brandname{font-size:15px; font-weight:700}
.big{font-size:36px; font-weight:800; letter-spacing:-.5px}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.trio span:first-child{display:block; font-size:12px; color:var(--hdr-sub)}
.trio b{font-size:15px}
.iconbtn{width:44px; height:44px; border:0; background:transparent; color:inherit; display:inline-flex; align-items:center; justify-content:center; border-radius:12px}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.monthnav{display:flex; align-items:center; gap:2px; font-weight:600}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok-text)} .pill.warn{background:var(--warn-soft); color:var(--warn-text)}
.pill.bad{background:var(--bad-soft); color:var(--bad-text)} .pill.info{background:var(--info-soft); color:var(--info-text)}
.pill.mute{background:var(--surface-2); color:var(--muted)} .pill.brand{background:var(--brand-soft); color:var(--brand-text)}
.hdr .pill.sync{background:rgba(255,255,255,.14); color:var(--brand-ink); border:0}
.main{padding-block:14px 8px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:14px}
.main.lift{margin-top:-58px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.card.flush{padding:0; overflow:hidden; gap:0}
.card h2{font-size:16px; font-weight:700}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.row.base{align-items:baseline}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.kpi{display:flex; flex-direction:column; gap:5px; min-width:0}
.kpi .lab{font-size:12px; font-weight:600; color:var(--muted)}
.kpi .val{font-size:22px; font-weight:800}
.kpi .val small{font-size:14px; font-weight:600; color:var(--muted)}
.bar{position:relative; height:10px; margin:3px 0}
.bar .trk{position:absolute; inset:0; border-radius:6px; background:var(--track); overflow:hidden}
.bar .fill{height:100%; border-radius:6px}
.bar .tick{position:absolute; top:-4px; width:2px; height:18px; border-radius:1px; background:var(--tick)}
.bar.thin{height:8px}
.f-ok{background:var(--ok)} .f-warn{background:var(--warn)} .f-bad{background:var(--bad)} .f-brand{background:var(--brand-text)}
.t-ok{color:var(--ok-text)} .t-warn{color:var(--warn-text)} .t-bad{color:var(--bad-text)} .t-brand{color:var(--brand-text)}
.list{display:flex; flex-direction:column}
.li{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); text-align:left; width:100%; background:transparent; border-left:0; border-right:0; border-bottom:0}
.list > .li:first-child{border-top:0}
.li .grow{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.li .t{font-size:14px; font-weight:600; overflow-wrap:anywhere}
.li .s{font-size:12px; color:var(--muted)}
.amt{font-size:14px; font-weight:700; white-space:nowrap}
.ico{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.ico.lg{width:46px; height:46px; border-radius:15px}
.ico.ok{background:var(--ok-soft); color:var(--ok-text)} .ico.warn{background:var(--warn-soft); color:var(--warn-text)}
.ico.bad{background:var(--bad-soft); color:var(--bad-text)} .ico.brand{background:var(--brand-soft); color:var(--brand-text)}
.ico.mute{background:var(--surface-2); color:var(--muted)}
.chev{color:var(--muted); flex-shrink:0}
.sec-h{background:var(--brand-soft); display:flex; align-items:center; justify-content:space-between; padding:4px 6px}
.sec-h .ttl{display:flex; flex-direction:column; align-items:center}
.sec-h .ttl b{font-size:16px; font-weight:800; color:var(--brand-text)}
.sec-h .ttl span{font-size:12px; color:var(--muted)}
.sec-h .iconbtn{color:var(--brand-text)}
.bud{display:flex; gap:12px; padding:15px 16px; border:0; border-top:1px solid var(--line); background:transparent; width:100%; text-align:left}
.bud .grow{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.bud .name{font-size:15px; font-weight:700; overflow-wrap:anywhere}
.bud .pct{font-size:15px; font-weight:800}
.empty{padding:18px 16px; font-size:14px; color:var(--muted); text-align:center}
.legend{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted)}
.legend .bar{flex:0 0 36px}
.callout{border-radius:14px; padding:11px 13px; font-size:13px; line-height:1.4; display:flex; gap:10px; align-items:flex-start}
.callout.brand{background:var(--brand-soft); color:var(--fg)} .callout.warn{background:var(--warn-soft); color:var(--fg)}
.callout.bad{background:var(--bad-soft); color:var(--fg)}
.btn{min-height:46px; border-radius:14px; border:0; background:var(--brand); color:var(--brand-ink); font-weight:700; font-size:15px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.ghost{background:transparent; color:var(--brand-text); border:1.5px solid var(--brand-text)}
.btn.dashed{background:transparent; color:var(--brand-text); border:1.5px dashed var(--brand-text); opacity:.9}
.btn.danger{background:transparent; color:var(--bad-text); border:1.5px solid var(--bad-text)}
.btn.sm{min-height:38px; font-size:13px; border-radius:11px; padding:0 12px}
.btn.wide{width:100%}
.linkbtn{border:0; background:transparent; color:var(--brand-text); font-weight:700; font-size:13px; min-height:36px; padding:0 4px}
.seg{display:grid; grid-auto-columns:minmax(0,1fr); grid-auto-flow:column; gap:4px; background:var(--surface-2); padding:4px; border-radius:14px}
.seg button{min-height:40px; border:0; border-radius:11px; background:transparent; color:var(--muted); font-weight:700; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:38px; padding:0 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font-size:13px; font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.matrix{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px}
.matrix div{height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#1B1D1A}
.matrix .has{box-shadow:inset 0 0 0 2px #1B1D1A}
.lv1{background:#DDEBE2} .lv2{background:#F6E3B4} .lv3{background:#F4C7A1} .lv4{background:#E9A39B}
.axis-y{writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; font-weight:600; color:var(--muted); text-align:center}
.stat3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stat3 > div{border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:2px}
.stat3 b{font-size:20px; font-weight:800}
.split{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--track)}
.search{height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 12px; width:100%}
.dayhdr{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding-top:6px}
/* barra inferior */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px; margin:0 auto; height:72px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center}
.nav button{border:0; background:transparent; color:var(--muted); font-size:11px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:52px; justify-content:center}
.nav button[aria-current="page"]{color:var(--brand-text); font-weight:700}
.nav .fab{width:58px; height:58px; margin:-26px auto 0; border-radius:20px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(30,90,71,.35)}
/* folha inferior (formulários) */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:480px; max-height:92%; overflow:auto; border-radius:22px 22px 0 0; padding-block:8px calc(18px + env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:14px}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 0}
.sheet-h{display:flex; align-items:center; justify-content:space-between}
.sheet-h h2{font-size:19px; font-weight:800}
.fld{display:flex; flex-direction:column; gap:6px; min-width:0}
.fld > label, .fld > .lab{font-size:13px; font-weight:700; color:var(--muted)}
.inp{height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 12px; width:100%; min-width:0}
textarea.inp{height:auto; min-height:84px; padding:10px 12px; resize:vertical}
.amount{display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px}
.amount input{border:0; background:transparent; text-align:center; font-size:38px; font-weight:800; width:100%; letter-spacing:-.5px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; z-index:60; max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px); opacity:.6}} }
</style>

  itens.sort(function (a, b) { return (a.b.Escopo === 'Total' ? -1 : 0) - (b.b.Escopo === 'Total' ? -1 : 0) || b.p - a.p; });
  return { per:per, itens:itens };
}

/* acerto do mês */
function acerto(ym, L) {
  var ps = pessoas(), r = monthRange(ym), renda = {}, pago = {};
  ps.forEach(function (p) { renda[p] = 0; pago[p] = 0; });
  var total = 0;
  L.forEach(function (l) {
    if (!inRange(l.d, r[0], r[1])) return;
    if (l.tipo === 'Entrada') { if (renda[l.pessoa] != null) renda[l.pessoa] += l.v; return; }
    if (l.rateio !== 'Casa') return;
    if (pago[l.pessoa] != null) { pago[l.pessoa] += l.v; total += l.v; }
  });
  var regra = String(conf('regra_divisao', 'proporcional')).toLowerCase();
  var rt = renda[ps[0]] + renda[ps[1]];
  var share0 = (regra.indexOf('prop') === 0 && rt > 0) ? renda[ps[0]] / rt : .5;
  var deve0 = total * share0, dif = pago[ps[0]] - deve0;
  return { ps:ps, pago:pago, total:total, share0:share0, regra: (regra.indexOf('prop') === 0 && rt > 0) ? 'proporcional' : 'igual', de: dif < 0 ? ps[0] : ps[1], para: dif < 0 ? ps[1] : ps[0], valor:Math.abs(dif) };
}

/* controles */
function statusControle(c) {
  if (c.Frequencia === 'Contínuo') return { k:'mute', t:'Contínuo' };
  var d = parseD(c.UltimaVerificacao);
  if (!d) return { k:'mute', t:'Sem registro' };
  var dias = FREQ_DIAS[c.Frequencia] || 31;
  var prox = addDays(d, dias);
  if (prox < today()) return { k:'bad', t:'Atrasado', prox:prox };
  return { k:'ok', t:'Em dia', prox:prox };
}
function nivelRisco(p, i) {
  var s = num(p) * num(i);
  if (!s) return null;
  if (s >= 15) return { n:'Crítico', k:'bad', lv:4, s:s };
  if (s >= 10) return { n:'Alto', k:'warn', lv:3, s:s };
  if (s >= 5) return { n:'Médio', k:'info', lv:2, s:s };
  return { n:'Baixo', k:'ok', lv:1, s:s };
}
function riscoAberto(r) { return ['Encerrado','Controlado'].indexOf(r.Status) < 0; }

/* alertas (sempre olhando os períodos atuais) */
function alertas(L) {
  var out = [];
  ['Semanal','Mensal','Anual'].forEach(function (k) {
    orcamentosDe(k, 0, L).itens.forEach(function (it) {
      if (it.st === 'ok') return;
      var quando = { Semanal:'da semana', Mensal:'do mês', Anual:'do ano' }[k];
      out.push({ k:it.st, go:'orcamentos', html:'<strong>' + esc(it.b.Nome) + '</strong>: ' + pctf(it.p) + ' do limite ' + quando });
    });
  });
  var rm = resumoMes(ymOf(today()), L);
  if (rm.renda > 0 && rm.saldo < 0) out.push({ k:'bad', go:'inicio', html:'O mês está <strong>no vermelho</strong>: faltam ' + brl(-rm.saldo) });
  (data.Controles || []).forEach(function (c) { if (statusControle(c).k === 'bad') out.push({ k:'warn', go:'casal', ico:'shield', html:'Controle <strong>' + esc(c.Controle) + '</strong> está atrasado' }); });
  var crit = (data.Riscos || []).filter(function (r) { var n = nivelRisco(r.Probabilidade, r.Impacto); return r.Aplica === 'Sim' && riscoAberto(r) && n && n.lv === 4; }).length;
  if (crit) out.push({ k:'bad', go:'casal', ico:'shield', html:crit + (crit > 1 ? ' riscos críticos' : ' risco crítico') + ' em aberto' });
  out.sort(function (a, b) { return (a.k === 'bad' ? 0 : 1) - (b.k === 'bad' ? 0 : 1); });
  return out;
}

/* simulação de dívida: meses para quitar e juros pagos */
function quitacao(saldo, taxa, parcela) {
  if (saldo <= 0) return { n:0, juros:0 };
  if (parcela <= 0) return null;
  if (taxa <= 0) return { n:Math.ceil(saldo / parcela), juros:0 };
  if (saldo * taxa >= parcela) return { nunca:true };
  var n = -Math.log(1 - taxa * saldo / parcela) / Math.log(1 + taxa);
  return { n:Math.ceil(n), juros: Math.max(0, parcela * n - saldo) };
}

/* =================== gravação e sincronização =================== */
function keyOf(sheet) { return KEYCOL[sheet] || 'ID'; }
function applyLocal(op) {
  var arr = data[op.sheet] = data[op.sheet] || [], k = keyOf(op.sheet);
  var key = op.op === 'delete' ? op.key : op.row[k];
  var i = arr.findIndex(function (r) { return String(r[k]) === String(key); });
  if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = Object.assign({}, arr[i], op.row); else arr.push(Object.assign({}, op.row));
}
function salvar(sheet, row) { commit({ op:'upsert', sheet:sheet, row:row }); }
function excluir(sheet, key) { commit({ op:'delete', sheet:sheet, key:key }); }
function commit(op) {
  applyLocal(op); lsSet(LS.data, data);
  if (online()) { queue.push(op); lsSet(LS.queue, queue); flush(); }
  render();
}
function online() { return !cfg.demo && !!cfg.url; }

var flushing = false;
function flush() {
  if (!online() || flushing || !queue.length) { renderSync(); return Promise.resolve(); }
  flushing = true; sync.state = 'sending'; renderSync();
  var lote = queue.slice(0, 40);
  return fetch(cfg.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ token:cfg.token, action:'batch', ops:lote }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Erro na planilha');
      var falhas = res.results.filter(function (x) { return !x.ok; });
      queue = queue.slice(lote.length); lsSet(LS.queue, queue);
      sync.state = 'ok'; sync.msg = falhas.length ? falhas.length + ' alteração(ões) recusada(s): ' + falhas[0].error : '';
      if (falhas.length) toast('A planilha recusou: ' + falhas[0].error);
    })
    .catch(function (e) { sync.state = 'offline'; sync.msg = String(e.message || e); })
    .then(function () { flushing = false; renderSync(); if (queue.length && sync.state === 'ok') return flush(); });
}
function carregar(silencioso) {
  if (!online()) { renderSync(); return Promise.resolve(); }
  sync.state = 'loading'; renderSync();
  return flush().then(function () {
    return fetch(cfg.url + (cfg.url.indexOf('?') >= 0 ? '&' : '?') + 'action=all&token=' + encodeURIComponent(cfg.token));
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (!res.ok) throw new Error(res.error || 'Erro na planilha');
    data = res.data; SHEETS.forEach(function (s) { data[s] = data[s] || []; });
    queue.forEach(applyLocal);
    lsSet(LS.data, data); sync.state = 'ok'; sync.msg = ''; sync.at = new Date();
    render(); if (!silencioso) toast('Dados atualizados da planilha');
  }).catch(function (e) { sync.state = 'offline'; sync.msg = String(e.message || e); renderSync(); if (!silencioso) toast('Não consegui falar com a planilha: ' + sync.msg); });
}
function syncPill() {
  if (cfg.demo || !cfg.url) return '<button class="pill sync" data-act="go" data-tab="config">Demonstração</button>';
  var n = queue.length;
  var t = { loading:'Carregando…', sending:'Enviando ' + n + '…', offline: n ? 'Sem conexão · ' + n + ' pendente' + (n > 1 ? 's' : '') : 'Sem conexão', ok:'Sincronizado', idle:'Conectado' }[sync.state] || 'Conectado';
  return '<button class="pill sync" data-act="refresh" aria-label="Atualizar dados da planilha">' + ic('sync', 14) + esc(t) + '</button>';
}

  var corValor = d.tipo === 'Entrada' ? 'var(--ok-text)' : (d.tipo === 'Aporte' ? 'var(--brand-text)' : 'var(--fg)');
  var h = '<div class="scrim" data-act="scrim"><form class="sheet" id="lancForm" role="dialog" aria-modal="true" aria-label="Lançamento"><div class="grab"></div>' +
    '<div class="sheet-h"><h2>' + (d.id ? 'Editar lançamento' : 'Novo lançamento') + '</h2><button type="button" class="iconbtn" data-act="close" aria-label="Fechar">' + ic('x', 22) + '</button></div>' +
    '<div class="seg" role="group" aria-label="Tipo">' + ['Saída','Entrada','Aporte'].map(function (t) { return '<button type="button" data-act="lset" data-k="tipo" data-v="' + t + '" aria-pressed="' + (d.tipo === t) + '">' + t + '</button>'; }).join('') + '</div>' +
    '<div class="amount"><label for="lValor" class="small muted" style="font-weight:600">Valor</label><input id="lValor" inputmode="decimal" placeholder="0,00" data-input="lvalor" value="' + esc(d.valor) + '" style="color:' + corValor + '"></div>' +
    '<div class="fld"><span class="lab">Categoria</span><div class="chips">' + top.map(function (c) { return '<button type="button" class="chip" data-act="lset" data-k="cat" data-v="' + esc(c) + '" aria-pressed="' + (d.cat === c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' + sel +
    '<span class="tiny muted" id="lMacro">' + (d.cat ? 'Macro: <strong>' + esc(catMacro()[d.cat] || '') + '</strong>' : 'Escolham uma categoria') + '</span></div>' +
    '<div class="grid2"><div class="fld"><label for="lData">Data</label><input type="date" id="lData" class="inp" data-input="ldata" value="' + esc(d.data) + '"></div>' +
    '<div class="fld"><label for="lDesc">Descrição</label><input id="lDesc" class="inp" data-input="ldesc" value="' + esc(d.desc) + '" placeholder="Opcional"></div></div>' +
    '<div class="fld"><span class="lab">' + (d.tipo === 'Entrada' ? 'Quem recebeu' : 'Quem pagou') + '</span><div class="seg" role="group">' + ps.map(function (p) { return '<button type="button" data-act="lset" data-k="pessoa" data-v="' + esc(p) + '" aria-pressed="' + (d.pessoa === p) + '">' + esc(p) + '</button>'; }).join('') + '</div></div>';
  if (d.tipo !== 'Entrada') {
    h += '<div class="fld"><span class="lab">Conta de quem</span><div class="seg" role="group"><button type="button" data-act="lset" data-k="rateio" data-v="Casa" aria-pressed="' + (d.rateio === 'Casa') + '">Da casa (divide)</button><button type="button" data-act="lset" data-k="rateio" data-v="Pessoal" aria-pressed="' + (d.rateio === 'Pessoal') + '">Pessoal</button></div></div>' +
      '<div class="fld"><span class="lab">Forma de pagamento</span><div class="chips">' + FORMAS.map(function (f) { return '<button type="button" class="chip" data-act="lset" data-k="forma" data-v="' + esc(f) + '" aria-pressed="' + (d.forma === f) + '">' + esc(f) + '</button>'; }).join('') + '</div></div>';
  }
  h += '<div id="lImpact">' + impactoHtml() + '</div>' +
    '<button class="btn" type="submit">' + (d.id ? 'Salvar alterações' : 'Salvar lançamento') + '</button>' +
    (d.id ? '<button class="btn danger" type="button" data-act="ldel">' + (d.del ? 'Toque de novo para excluir' : 'Excluir lançamento') + '</button>' : '') + '</form></div>';
  return h;
}
function impactoHtml() {
  var d = draft; if (!d || !d.cat || d.tipo !== 'Saída') return '';
  var v = num(d.valor); if (!v) return '';
  var cm = catMacro(), L = lancs().filter(function (l) { return l.id !== d.id; });
  var novo = { d:parseD(d.data) || today(), cat:d.cat, macro:cm[d.cat], tipo:'Despesa', v:v };
  var piores = [];
  ['Semanal','Mensal','Anual'].forEach(function (k) {
    var per = periodo(k, 0);
    if (!inRange(novo.d, per.s, per.e)) return;
    (data.Orcamentos || []).forEach(function (b) {
      if (b.Periodicidade !== k || String(b.Ativo || 'Sim') === 'Não' || !num(b.Limite)) return;
      if (!(b.Escopo === 'Total' || (b.Escopo === 'Macro' && b.Alvo === novo.macro) || (b.Escopo === 'Categoria' && b.Alvo === novo.cat))) return;
      var g = gastoNo(b, per.s, per.e, L, cm, novo), p = g / num(b.Limite);
      piores.push({ b:b, g:g, p:p, k:k });
    });
  });
  if (!piores.length) return '<div class="callout brand">Esta categoria não tem limite definido.</div>';
  piores.sort(function (a, b) { return b.p - a.p; });
  var x = piores[0], st = status(x.p), quando = { Semanal:'da semana', Mensal:'do mês', Anual:'do ano' }[x.k];
  return '<div class="callout ' + (st === 'ok' ? 'brand' : st) + '"><span class="t-' + st + '">' + ic('alert', 20) + '</span><span>Com este lançamento, <strong>' + esc(x.b.Nome) + '</strong> fica em ' + pctf(x.p) + ' do limite ' + quando + ' (' + brl0(x.g) + ' de ' + brl0(num(x.b.Limite)) + ').</span></div>';
}
function salvarLanc() {
  var d = draft, v = num(d.valor);
  if (!v) { toast('Informe o valor.'); return; }
  if (!d.cat) { toast('Escolha a categoria.'); return; }
  var row = { ID: d.id || uid('L'), Data:d.data || ymd(today()), Categoria:d.cat, Descricao:d.desc, Valor:v, Pessoa:d.pessoa, Rateio: d.tipo === 'Entrada' ? 'Pessoal' : d.rateio, FormaPagamento: d.tipo === 'Entrada' ? 'Transferência' : d.forma };
  if (!d.id) { var n = new Date(); row.CriadoEm = ymd(n) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()); row.CriadoPor = cfg.autor || d.pessoa; }
  var ehNovo = !d.id;
  fecharSheet(); salvar('Lancamentos', row);
  toast(ehNovo ? 'Lançamento salvo' : 'Lançamento atualizado');
}

/* ---- formulários das outras abas ---- */
function achar(sheet, id) { var k = keyOf(sheet); return (data[sheet] || []).filter(function (r) { return String(r[k]) === String(id); })[0]; }
function formGenerico(sheet, titulo, fields, row, novoId) {
  var existe = !!row;
  abrirForm({ title:titulo, fields:fields, values: row || {},
    onSave: function (v) { var k = keyOf(sheet); v[k] = existe ? row[k] : (novoId || uid(sheet.charAt(0))); salvar(sheet, v); toast('Salvo'); },
    onDelete: existe && sheet !== 'Config' ? function () { excluir(sheet, row[keyOf(sheet)]); toast('Excluído'); } : null });
}
function formOrc(row) {
  var cats = (data.Categorias || []).map(function (c) { return c.Categoria; });
  var alvos = [{ v:'', t:'(todas as despesas)' }].concat(macrosOrdenadas().map(function (m) { return { v:m, t:'Macro · ' + m }; }), cats.map(function (c) { return { v:c, t:c }; }));
  var v = row ? Object.assign({}, row) : { Periodicidade:'Mensal', Ativo:'Sim' };
  abrirForm({ title: row ? 'Editar limite' : 'Novo limite', values:v,
    fields:[{ name:'Nome', label:'Nome', ph:'Ex.: Mercado da semana' }, { name:'Alvo', label:'O que entra no limite', type:'select', options:alvos }, { name:'Periodicidade', label:'Período', type:'seg', options:['Semanal','Mensal','Anual'] }, { name:'Limite', label:'Limite (R$)', type:'money' }, { name:'Ativo', label:'Ativo', type:'seg', options:['Sim','Não'] }, { name:'Obs', label:'Observação' }],
    onSave: function (x) {
      x.Escopo = !x.Alvo ? 'Total' : (macrosOrdenadas().indexOf(x.Alvo) >= 0 ? 'Macro' : 'Categoria');
      if (!x.Nome) x.Nome = x.Alvo || 'Todas as despesas';
      x.ID = row ? row.ID : uid('O'); salvar('Orcamentos', x); toast('Limite salvo');
    },
    onDelete: row ? function () { excluir('Orcamentos', row.ID); toast('Limite excluído'); } : null });
}
function formPlano(row) {
  formGenerico('Planos', row ? 'Editar plano' : 'Novo plano', [
    { name:'Objetivo', label:'Objetivo' }, { name:'Horizonte', label:'Horizonte', type:'seg', options:['Curto prazo','Médio prazo','Longo prazo'] },
    { name:'ValorNecessario', label:'Valor necessário', type:'money', pair:true }, { name:'JaGuardado', label:'Já guardado', type:'money' },
    { name:'DataAlvo', label:'Data-alvo', type:'date', pair:true }, { name:'Status', label:'Status', type:'select', options:['A definir','Planejado','Em andamento','Concluído','Pausado','Cancelado'] },
    { name:'Motivo', label:'Por que é importante', type:'textarea' }, { name:'ProximoPasso', label:'Próximo passo' }, { name:'Responsavel', label:'Responsável', type:'select', options:['Casal'].concat(pessoas()) }
  ], row);
}
function formDivida(row) {
  formGenerico('Dividas', row ? 'Editar dívida' : 'Nova dívida', [
    { name:'Divida', label:'Dívida' }, { name:'Credor', label:'Credor' },
    { name:'SaldoDevedor', label:'Saldo devedor', type:'money', pair:true }, { name:'Parcela', label:'Parcela mensal', type:'money' },
    { name:'ParcelasRestantes', label:'Parcelas restantes', type:'number', pair:true }, { name:'JurosMes', label:'Juros ao mês (%)', type:'percent', ph:'Ex.: 1,5' },
    { name:'Obs', label:'Observação', type:'textarea' }
  ], row);
}
function formRisco(row) {
  formGenerico('Riscos', 'Risco', [
    { name:'Risco', label:'Risco' }, { name:'Aplica', label:'Aplica-se a vocês?', type:'seg', options:['Sim','Não'] },
    { name:'Probabilidade', label:'Probabilidade (1 = muito improvável · 5 = quase certo)', type:'seg', num:true, options:['1','2','3','4','5'] },
    { name:'Impacto', label:'Impacto (1 = incômodo leve · 5 = muda a vida)', type:'seg', num:true, options:['1','2','3','4','5'] },
    { name:'Status', label:'Status', type:'select', options:['Aberto','Em tratamento','Controlado','Encerrado'] },
    { name:'Mitigacao', label:'Como resolver ou mitigar', type:'textarea' }, { name:'UltimaRevisao', label:'Última revisão', type:'date' }
  ], row ? Object.assign({}, row, { UltimaRevisao: ymd(today()) }) : null);
}
function formComb(row) {
  formGenerico('Combinados', row.Tema || 'Combinado', [
    { name:'Pergunta', label:'Pergunta' }, { name:'Decisao', label:'Decisão de vocês', type:'textarea' },
    { name:'DataDecisao', label:'Data da decisão', type:'date', pair:true }, { name:'RevisarEm', label:'Revisar em', type:'date' }
  ], Object.assign({}, row, { DataDecisao: row.DataDecisao || ymd(today()) }));
}
function formReuniao(row) {
  formGenerico('Reunioes', row ? 'Reunião' : 'Registrar reunião', [
    { name:'Data', label:'Data', type:'date', pair:true }, { name:'Participantes', label:'Participantes' },
    { name:'Pontos', label:'Principais pontos', type:'textarea' }, { name:'Decisoes', label:'Decisões', type:'textarea' }, { name:'Pendencias', label:'Pendências', type:'textarea' },
    { name:'Responsavel', label:'Responsável', type:'select', options:['Casal'].concat(pessoas()), pair:true }, { name:'Prazo', label:'Prazo', type:'date' }
  ], row || { Data: ymd(today()), Participantes: pessoas().join(' e ') });
}

/* =================== render e eventos =================== */
var TABS = [['inicio','Início','home'],['orcamentos','Orçamentos','list'],['lancar','','plus'],['metas','Metas','target'],['casal','Casal','people']];
function render() {
  var v = { inicio:vInicio, orcamentos:vOrcamentos, metas:vMetas, casal:vCasal, lista:vLista, config:vConfig }[ui.tab] || vInicio;
  document.getElementById('view').innerHTML = v();
  var cur = ui.tab === 'lista' || ui.tab === 'config' ? 'inicio' : ui.tab;
  document.getElementById('nav').innerHTML = TABS.map(function (t) {
    if (t[0] === 'lancar') return '<button data-act="novoLanc" aria-label="Novo lançamento"><span class="fab">' + ic('plus', 26) + '</span></button>';
    return '<button data-act="go" data-tab="' + t[0] + '"' + (cur === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2], 22) + t[1] + '</button>';
  }).join('');
  renderSheet();
}
var toastT;
function toast(msg) { var r = document.getElementById('toastRoot'); r.innerHTML = '<div class="toast">' + esc(msg) + '</div>'; clearTimeout(toastT); toastT = setTimeout(function () { r.innerHTML = ''; }, 2600); }

var ACT = {
  go: function (d) { ui.tab = d.tab; ui.q = ''; window.scrollTo(0, 0); render(); },
  ym: function (d) { ui.ym = shiftYm(ui.ym, +d.n); render(); },
  per: function (d) { ui.off[d.k] += +d.n; render(); },
  refresh: function () { carregar(false); },
  novoLanc: function () { abrirLanc(null); },
  editLanc: function (d) { abrirLanc(d.id); },
  lset: function (d) {
    syncDraftInputs();
    draft[d.k] = d.v;
    if (d.k === 'tipo') { var cs = catsDoTipo(d.v).map(function (c) { return c.Categoria; }); if (cs.indexOf(draft.cat) < 0) draft.cat = ''; }
    renderSheet();
  },
  ldel: function () { if (!draft.del) { draft.del = true; syncDraftInputs(); renderSheet(); return; } var id = draft.id; fecharSheet(); excluir('Lancamentos', id); toast('Lançamento excluído'); },
  close: fecharSheet,
  scrim: function (d, e) { if (e.target.classList.contains('scrim')) fecharSheet(); },
  fseg: function (d, e) {
    var wrap = e.target.closest('.fld');
    wrap.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === e.target.closest('button'))); });
    wrap.querySelector('input[type=hidden]').value = d.v;
  },
  fdel: function () { if (!form.confirmDel) { var vals = lerForm(); Object.assign(form.values, vals); form.confirmDel = true; renderSheet(); return; } var f = form; fecharSheet(); f.onDelete(); },
  novoOrc: function () { formOrc(null); },
  editOrc: function (d) { formOrc(achar('Orcamentos', d.id)); },
  novoPlano: function () { formPlano(null); },
  editPlano: function (d) { formPlano(achar('Planos', d.id)); },
  novaDivida: function () { formDivida(null); },
  editDivida: function (d) { formDivida(achar('Dividas', d.id)); },
  debtOrder: function (d) { ui.debtOrder = d.v; render(); },
  riskF: function (d) { ui.riskFilter = d.v; render(); },
  editRisco: function (d) { formRisco(achar('Riscos', d.id)); },
  feito: function (d) { var c = achar('Controles', d.id); salvar('Controles', { ID:c.ID, UltimaVerificacao: ymd(today()), Resultado:'OK' }); toast('Controle registrado hoje'); },
  editComb: function (d) { formComb(achar('Combinados', d.id)); },
  novaReuniao: function () { formReuniao(null); },
  editReuniao: function (d) { formReuniao(achar('Reunioes', d.id)); },
  editConfig: function (d) { var c = achar('Config', d.id); formGenerico('Config', c.Descricao || c.Chave, [{ name:'Valor', label:'Valor', help:c.Chave }], c); },
  conectar: function () {
    cfg.url = document.getElementById('cfgUrl').value.trim(); cfg.token = document.getElementById('cfgToken').value.trim(); cfg.autor = document.getElementById('cfgAutor').value;
    if (!cfg.url || !cfg.token) { toast('Preencha a URL e o token.'); return; }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.url)) { toast('A URL deve ser do Apps Script (script.google.com).'); return; }
    var antes = cfg.demo; cfg.demo = false; lsSet(LS.cfg, cfg);
    if (antes) { queue = []; lsSet(LS.queue, queue); }
    carregar(false).then(function () {
      if (sync.state === 'ok') { ui.tab = 'inicio'; }
      else if (antes) { cfg.demo = true; lsSet(LS.cfg, cfg); }
      render();
    });
  },
  demo: function () {
    cfg.demo = true; lsSet(LS.cfg, cfg); queue = []; lsSet(LS.queue, queue);
    data = clone(DEMO_DATA) || emptyData(); lsSet(LS.data, data); sync.state = 'demo'; render(); toast('Dados de exemplo carregados');
  }
};
function syncDraftInputs() {
  if (!draft) return;
  var g = function (id) { var e = document.getElementById(id); return e ? e.value : null; };
  var v = g('lValor'); if (v != null) draft.valor = v;
  v = g('lData'); if (v != null) draft.data = v;
  v = g('lDesc'); if (v != null) draft.desc = v;
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act;
  if (a === 'scrim' && el !== e.target) return;
  if (ACT[a]) { e.preventDefault(); ACT[a](el.dataset, e); }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.id === 'lancForm') { syncDraftInputs(); salvarLanc(); return; }
  if (e.target.id === 'sheetForm' && form) { var v = lerForm(), f = form; fecharSheet(); f.onSave(v); }
});
document.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.input; if (!k) return;
  if (k === 'busca') { ui.q = e.target.value; var box = document.getElementById('listaBox'); if (box) box.innerHTML = listaHtml(lancs().filter(function (l) { return ymOf(l.d) === ui.ym; })); }
  if (k === 'sim') { ui.sim[e.target.dataset.id] = e.target.value; var d = achar('Dividas', e.target.dataset.id), out = document.getElementById('sim-' + d.ID); if (out) out.innerHTML = simHtml(d); }
  if (draft && (k === 'lvalor' || k === 'ldata' || k === 'ldesc')) { syncDraftInputs(); var im = document.getElementById('lImpact'); if (im) im.innerHTML = impactoHtml(); }
});
document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.input === 'lcat' && draft) { syncDraftInputs(); draft.cat = e.target.value; renderSheet(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (form || draft)) fecharSheet(); });
window.addEventListener('online', function () { flush(); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && online()) carregar(true); });

render();
if (online()) carregar(true);
})();
</script>
